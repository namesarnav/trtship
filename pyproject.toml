[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trtship"
version = "0.1.0"
description = "Reproducible PyTorch to TensorRT to Triton deployment pipeline: export, validate, calibrate, build, benchmark, serve."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["tensorrt", "triton", "onnx", "pytorch", "inference", "int8", "quantization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "pillow>=10.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.7",
    "torch>=2.3",
    "typer>=0.12",
]

[project.optional-dependencies]
# TensorRT Python bindings. Requires an NVIDIA GPU environment and a CUDA build of torch (trtship
# uses torch tensors for GPU buffers); see docs/pipeline/tensorrt.md.
trt = ["tensorrt>=10.0"]
# Triton HTTP/gRPC clients.
triton = ["tritonclient[all]>=2.40"]
# The torch.export-based ONNX exporter (`export.dynamo: true`).
dynamo = ["onnxscript>=0.1"]
# The ResNet-50 example (`examples/resnet50`); install the build matching your torch.
examples = ["torchvision>=0.18"]

[project.scripts]
trtship = "trtship.cli.main:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    # Triton's protobuf schema validates generated configs; the client wrapper is tested with the
    # real client libraries against a protocol stub.
    "tritonclient[all]>=2.40",
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trtship"]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PT", "RUF", "PL", "S", "N", "A"]
ignore = [
    "PLR0913",  # explicit keyword-heavy stage/config constructors are intentional
    "PLR0917",  # same, and Typer commands take one parameter per CLI option
    "PLR2004",  # magic values in comparisons are fine in validation thresholds
    "S101",     # asserts are used in tests; production code does not rely on them
    "A005",     # trtship.logging intentionally mirrors the stdlib package name
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "N802", "A"]
"src/trtship/utils/subprocess.py" = ["S404", "S603"]
"src/trtship/utils/env.py" = ["S404", "S603", "S607"]
"src/trtship/triton/server.py" = ["S404", "S603", "S607"]

[tool.ruff.format]
quote-style = "double"
exclude = ["*.md"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
strict = true
warn_unreachable = true
# Interpreters built without _sqlite3 (some pyenv builds) crash mypy's default SQLite cache.
sqlite_cache = false
plugins = ["pydantic.mypy"]
files = ["src/trtship", "tests"]

[[tool.mypy.overrides]]
module = [
    "onnx.*",
    "onnxruntime.*",
    "tensorrt.*",
    "tritonclient.*",
    "google.protobuf.*",
    "grpc.*",
    "cuda.*",
    "cuda_python.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Makes the test-only `trtship_fixtures` package importable, as a user's own model package would be.
pythonpath = ["tests/fixtures"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    # TorchScript is deprecated upstream but still supported by trtship (see DECISIONS.md D-016).
    "ignore:`torch\\.jit\\.(script|load|save|trace)` is deprecated:FutureWarning",
]
markers = [
    "gpu: requires a usable NVIDIA GPU (skipped, never passed, when absent)",
    "tensorrt: requires the TensorRT Python package and a supported GPU",
    "docker: requires a working Docker daemon",
    "triton: requires a running Triton Inference Server",
    "e2e: end-to-end pipeline test",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["trtship"]
branch = true

[tool.coverage.report]
show_missing = true
# Measured 96% on the CPU suite; the floor catches a regression without churning on small changes.
fail_under = 90
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.$",
]
