# ResNet-50 image classification through FP32, FP16 and INT8.
#   pip install torchvision
#   trtship config validate configs/examples/resnet50.yaml
#   trtship run configs/examples/resnet50.yaml --until optimize         # CPU only
#   trtship run configs/examples/resnet50.yaml                          # needs a GPU + TensorRT
#
# The factory returns ResNet-50 with deterministic random weights, which is enough to exercise the
# pipeline but says nothing about accuracy. For a trained model, replace the model block with
#
#   model:
#     kind: checkpoint
#     path: weights/resnet50.pth          # a state_dict saved with torch.save
#     factory: resnet50.model:build
#     ...
#
# INT8 needs representative images: put a few hundred JPEG/PNG files in the directory named by
# calibration.path. Random or synthetic data produces unreliable INT8 scales, so trtship refuses it
# unless `allow_synthetic: true` is set explicitly.
seed: 0

model:
  name: resnet50
  kind: module
  factory: resnet50.model:build
  python_path: [../../examples]      # relative to this file
  inputs:
    - name: image
      dtype: float32
      shape: [batch, 3, 224, 224]
  output_names: [logits]

export:
  opset: 17

optimize:
  enabled: true

tensorrt:
  precisions: [fp32, fp16, int8]
  workspace_mb: 4096
  profiles:
    - inputs:
        image:
          min: [1, 3, 224, 224]
          opt: [8, 3, 224, 224]
          max: [32, 3, 224, 224]

calibration:
  dataset: images
  path: data/calibration            # relative to this file; not shipped, add your own images
  num_samples: 512
  batch_size: 8
  preprocessing:
    resize: [256, 256]
    center_crop: [224, 224]
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

benchmark:
  batch_sizes: [1, 8, 32]
  concurrency: [1, 4]

triton:
  dynamic_batching:
    preferred_batch_sizes: [8, 16]
    max_queue_delay_us: 200

validation:
  num_samples: 8

artifacts:
  root: runs
