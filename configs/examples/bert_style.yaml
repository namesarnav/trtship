# A BERT-style classifier: three integer inputs and dynamic batch *and* sequence length.
#   trtship config validate configs/examples/bert_style.yaml
#   trtship run configs/examples/bert_style.yaml --until optimize       # CPU only
#   trtship run configs/examples/bert_style.yaml                        # needs a GPU + TensorRT
seed: 0

model:
  name: bert_style
  kind: module
  factory: bert_style.model:build
  python_path: [../../examples]      # relative to this file
  inputs:
    - name: input_ids
      dtype: int64
      shape: [batch, seq]
      value_range: [0, 1000]         # token ids must stay inside the vocabulary
    - name: attention_mask
      dtype: int64
      shape: [batch, seq]
      value_range: [0, 2]
    - name: token_type_ids
      dtype: int64
      shape: [batch, seq]
      value_range: [0, 2]
  output_names: [logits]

export:
  opset: 17

optimize:
  enabled: true

tensorrt:
  # FP16 is the usual choice for transformers. INT8 needs calibration data that reflects real text
  # and is deliberately not enabled here.
  precisions: [fp32, fp16]
  workspace_mb: 2048
  profiles:
    - inputs:
        input_ids:      {min: [1, 8],  opt: [8, 128], max: [16, 384]}
        attention_mask: {min: [1, 8],  opt: [8, 128], max: [16, 384]}
        token_type_ids: {min: [1, 8],  opt: [8, 128], max: [16, 384]}

benchmark:
  batch_sizes: [1, 8]
  concurrency: [1, 4]

triton:
  dynamic_batching:
    preferred_batch_sizes: [8]
    max_queue_delay_us: 100

validation:
  num_samples: 8

artifacts:
  root: runs
