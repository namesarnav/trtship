# A small CNN classifier that runs the whole CPU pipeline in a few seconds.
#   trtship config validate configs/examples/custom_model.yaml
#   trtship run configs/examples/custom_model.yaml --until optimize
seed: 0

model:
  name: tinyconv
  kind: module
  factory: custom_model.model:build
  python_path: [../../examples]      # relative to this file
  inputs:
    - name: image
      dtype: float32
      shape: [batch, 3, 32, 32]      # a string dimension is dynamic
  output_names: [logits]

export:
  opset: 17

optimize:
  enabled: true

tensorrt:
  precisions: [fp32, fp16]
  workspace_mb: 1024
  profiles:
    - inputs:
        image:
          min: [1, 3, 32, 32]
          opt: [8, 3, 32, 32]
          max: [32, 3, 32, 32]

validation:
  num_samples: 4

artifacts:
  root: runs
